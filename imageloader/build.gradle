

plugins {
//    id 'maven-publish'
    id 'com.android.library'
//    id 'java'
}
group='com.github.one-piece-luffy'

android {
    compileSdk 35
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }




    defaultConfig {
        minSdkVersion 22
        targetSdkVersion 35

    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'com.allfootball.news.imageloader'


}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

//    implementation 'com.android.support:appcompat-v7:'+rootProject.ext.supportLibVersion


    //use glide
    api 'com.github.bumptech.glide:glide:5.0.5'
    api 'com.github.bumptech.glide:annotations:5.0.5'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.5'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    api ('com.github.bumptech.glide:okhttp3-integration:4.12.0'){
//        exclude group: 'com.squareup.okhttp3', module: 'okhttp'
    }
    //glide的各种transformations，包括高斯模糊
    api 'jp.wasabeef:glide-transformations:4.3.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"


}

apply plugin: "maven-publish"

android {
    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'com.github.one-piece-luffy' //groupId 随便取，jitpack不会使用
                artifactId = 'ImageLoader'  //test随便取,jitpack不会使用
                version = '2.5.18' //随便取，jitpack不会使用

            }
        }
    }
}


